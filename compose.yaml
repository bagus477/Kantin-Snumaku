services:
  app:
    image: ${APP_IMAGE:-kantin-app:local}
    container_name: kantin-app

    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_KEY: ${APP_KEY}

      APP_URL: ${APP_URL}

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - app-public:/shared-public

    command:
      - /bin/sh
      - -c
      - |
        rm -rf /shared-public/*
        cp -a public/. /shared-public/
        php-fpm

    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: kantin-db

    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}

    volumes:
      - kantin-db-data:/var/lib/mysql

  nginx:
    image: nginx:alpine
    container_name: kantin-nginx

    ports:
      - "8081:80"

    volumes:
      - app-public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

volumes:
  kantin-db-data:
  app-public:
